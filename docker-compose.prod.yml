services:
  fapinstructor:
    image: ${IMAGE:-ghcr.io/backip210-pixel/fap-instructor-personal:latest}
    container_name: fap-instructor-personal
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - fapinstructor-data:/data
    restart: unless-stopped

volumes:
  fapinstructor-data:
